<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@dannybag · Diario</title>
<link rel="icon" type="image/png" href="img/BikeIconBW.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root { --orange:#F05A28; --dark:#1A1A1A; --cream:#FFF8F4; --blue:#4FC3F7; --mono:'IBM Plex Mono',monospace; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--dark); color:var(--cream); font-family:'Barlow',sans-serif; min-height:100vh; }

  .header {
    background:#111;
    border-bottom:2px solid var(--orange);
    padding:1rem 5vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:0.5rem;
  }
  .header-title { font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:0.08em; color:var(--orange); }
  .header-title span { color:var(--cream); }
  .header-sub { font-family:var(--mono); font-size:0.55rem; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,248,244,0.3); }

  .intro {
    padding:1.6rem 5vw 0.4rem;
    max-width:640px;
    margin:0 auto;
    text-align:center;
  }
  .intro p {
    font-family:'Barlow Condensed',sans-serif;
    font-size:1.15rem;
    font-weight:400;
    color:rgba(255,248,244,0.65);
    line-height:1.4;
  }

  .log-section { padding:1.6rem 5vw 4rem; }

  /* spina dorsale del diario: una linea verticale come un percorso GPS */
  .log-track {
    position:relative;
    max-width:720px;
    margin:0 auto;
  }
  .log-track::before {
    content:'';
    position:absolute;
    left:2.6rem;
    top:0.4rem;
    bottom:0.4rem;
    width:2px;
    background:linear-gradient(to bottom, var(--orange), rgba(240,90,40,0.08));
  }

  .entry {
    position:relative;
    padding-left:5.6rem;
    margin-bottom:2.6rem;
  }
  .entry-day {
    position:absolute;
    left:0;
    top:0;
    width:5rem;
    text-align:right;
    padding-right:1.2rem;
  }
  .entry-day .n {
    font-family:'Bebas Neue',sans-serif;
    font-size:1.8rem;
    color:var(--orange);
    line-height:1;
  }
  .entry-day .d {
    font-family:var(--mono);
    font-size:0.55rem;
    letter-spacing:0.1em;
    color:rgba(255,248,244,0.35);
    text-transform:uppercase;
    margin-top:0.15rem;
  }
  .entry-dot {
    position:absolute;
    left:2.6rem;
    top:0.35rem;
    width:11px;
    height:11px;
    margin-left:-5px;
    border-radius:50%;
    background:var(--dark);
    border:2px solid var(--orange);
  }

  .entry-card {
    background:#111;
    border:1px solid rgba(240,90,40,0.15);
    border-radius:4px;
    padding:1.2rem 1.3rem;
  }
  .entry-title {
    font-family:'Barlow Condensed',sans-serif;
    font-size:1.3rem;
    font-weight:700;
    letter-spacing:0.01em;
    color:var(--cream);
    margin-bottom:0.5rem;
  }
  .entry-meta {
    font-family:var(--mono);
    font-size:0.6rem;
    color:rgba(255,248,244,0.35);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:0.7rem;
  }
  .entry-text {
    font-family:'Barlow',sans-serif;
    font-size:0.95rem;
    line-height:1.55;
    color:rgba(255,248,244,0.85);
    margin-bottom:0.9rem;
  }

  /* MEDIA */
  .media-photos { display:flex; gap:0.5rem; flex-wrap:wrap; justify-content:center; }
  .media-videos { display:flex; flex-direction:column; align-items:center; gap:0.6rem; margin-top:0.8rem; }
  .media-photo {
    width:96px; height:96px;
    border-radius:3px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid rgba(255,248,244,0.08);
    flex-shrink:0;
    position:relative;
    background:#0A0A0A;
  }
  .media-photo img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s; }
  .media-photo:hover img { transform:scale(1.06); }
  .media-video {
    width:100%;
    max-width:420px;
    border-radius:3px;
    overflow:hidden;
    border:1px solid rgba(255,248,244,0.08);
  }
  .media-video video { width:100%; display:block; background:#000; }

  /* anteprima YouTube: thumbnail + play, iframe solo on-click */
  .yt-preview {
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000 center/cover no-repeat;
    cursor:pointer;
  }
  .yt-preview .play-btn {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:2.6rem; height:2.6rem; border-radius:50%;
    background:rgba(240,90,40,0.9);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 6px rgba(0,0,0,0.25);
    transition:transform .2s;
  }
  .yt-preview:hover .play-btn { transform:translate(-50%,-50%) scale(1.08); }
  .yt-preview .play-btn::before {
    content:''; border-style:solid; border-width:7px 0 7px 12px;
    border-color:transparent transparent transparent #fff;
    margin-left:3px;
  }
  .yt-preview .yt-tag {
    position:absolute; bottom:6px; right:8px;
    font-family:var(--mono); font-size:0.55rem; letter-spacing:0.05em;
    color:rgba(255,255,255,0.8); background:rgba(0,0,0,0.5); padding:1px 5px; border-radius:2px;
  }
  .media-video iframe { width:100%; aspect-ratio:16/9; border:0; display:block; }
  .media-tag {
    position:absolute; bottom:3px; right:4px;
    font-family:var(--mono); font-size:0.5rem; color:#fff;
    background:rgba(0,0,0,0.55); padding:1px 4px; border-radius:2px;
  }

  .empty { text-align:center; padding:3rem; font-family:var(--mono); font-size:0.65rem; letter-spacing:0.1em; color:rgba(255,248,244,0.2); text-transform:uppercase; }

  /* LIGHTBOX */
  .lightbox {
    display:none; position:fixed; inset:0; background:rgba(10,10,10,0.92);
    z-index:100; align-items:center; justify-content:center; padding:4vw;
  }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:100%; max-height:90vh; border-radius:4px; }
  .lightbox-close {
    position:absolute; top:1.2rem; right:5vw;
    font-family:var(--mono); font-size:0.8rem; color:var(--cream);
    background:none; border:1px solid rgba(255,248,244,0.3);
    padding:0.3rem 0.7rem; cursor:pointer; letter-spacing:0.1em;
  }

  @media(max-width:600px) {
    .entry { padding-left:4.4rem; }
    .entry-day { width:3.8rem; }
    .entry-day .n { font-size:1.4rem; }
    .log-track::before { left:2rem; }
    .entry-dot { left:2rem; }
    .media-photo { width:78px; height:78px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">@danny<span>bag</span> · Diario</div>
    <div class="header-sub">Milano → Palermo · Note dal viaggio</div>
  </div>
  <div class="header-sub" id="last-update"></div>
</div>

<div class="intro">
  <p>Ricordi, incontri e imprevisti, giorno per giorno. Le tappe con i km sono su <a href="viaggio.html" style="color:var(--orange);">Il Viaggio</a>, qui invece il diario.</p>
</div>

<div class="log-section">
  <div class="log-track" id="log-track">
    <!-- generato via JS, esempio statico sotto per anteprima -->
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">CHIUDI ✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
// Dati di esempio — nella versione reale arrivano da diario.json sul repo
const MOCK_ENTRIES = [
  {
    day: 2,
    date: "2026-07-01",
    title: "Un caffè offerto a Pozzuolo",
    text: "Alla fine della prima tappa un signore al bar non ha voluto farmi pagare il caffè quando ha saputo dove sto andando. Piccole cose che pesano più dei km.",
    photos: ["img/OrangBike1.png", "img/OrangBike2.png"],
    videos: []
  },
  {
    day: 1,
    date: "2026-06-30",
    title: "Si parte",
    text: "Partenza da Milano alle 7, cielo grigio ma umore alto. Il primo chilometro è sempre il più strano: dopo mesi di preparazione, si parte davvero.",
    photos: ["img/OrangBike4azzurro.png", "img/OrangBike1.png", "img/OrangBike2.png"],
    videos: ["https://www.youtube.com/watch?v=dQw4w9WgXcQ", "https://www.youtube.com/watch?v=jNQXAC9IVRw"]
  }
];

function getYouTubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function renderVideo(url) {
  const ytId = getYouTubeId(url);
  if (ytId) {
    return `<div class="media-video">
      <div class="yt-preview" style="background-image:url('https://img.youtube.com/vi/${ytId}/hqdefault.jpg')" onclick="playYouTube(this, '${ytId}')">
        <div class="play-btn"></div>
        <span class="yt-tag">YOUTUBE</span>
      </div>
    </div>`;
  }
  // fallback: file video diretto (mp4 self-hosted)
  return `<div class="media-video"><video controls preload="metadata" src="${url}"></video></div>`;
}

function playYouTube(el, id) {
  el.outerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
}

function formatDate(iso) {
  const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const d = new Date(iso);
  return String(d.getDate()).padStart(2,'0') + ' ' + MESI[d.getMonth()];
}

function renderEntries(entries) {
  const track = document.getElementById('log-track');
  if (!entries.length) {
    track.innerHTML = '<div class="empty">Nessuna nota ancora</div>';
    return;
  }
  const sorted = [...entries].sort((a,b) => new Date(b.date) - new Date(a.date));
  track.innerHTML = sorted.map(e => {
    const photos = e.photos || [];
    // compatibilità: vecchie note potrebbero avere 'video' singolare invece di 'videos'
    const videos = e.videos || (e.video ? [e.video] : []);
    return `
    <div class="entry">
      <div class="entry-day"><div class="n">${e.day ?? ''}</div><div class="d">${formatDate(e.date)}</div></div>
      <div class="entry-dot"></div>
      <div class="entry-card">
        <div class="entry-title">${e.title}</div>
        <div class="entry-text">${e.text}</div>
        ${photos.length ? `<div class="media-photos">${photos.map(p => `<div class="media-photo" onclick="openLightbox('${p}')"><img src="${p}" loading="lazy"></div>`).join('')}</div>` : ''}
        ${videos.length ? `<div class="media-videos">${videos.map(v => renderVideo(v)).join('')}</div>` : ''}
      </div>
    </div>
  `;
  }).join('');
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// --- versione reale: fetch da GitHub Contents API, stesso pattern di viaggio.html ---
const GH_API = 'https://api.github.com/repos/dannybag/inbiciperilmondo/contents/diario.json';
async function load() {
  try {
    const res = await fetch(GH_API+'?t='+Date.now(), {cache:'no-store'});
    if (!res.ok) { renderEntries(MOCK_ENTRIES); return; } // fallback per anteprima
    const d = await res.json();
    const raw = JSON.parse(new TextDecoder().decode(
      Uint8Array.from(atob(d.content.replace(/\n/g,'')), c=>c.charCodeAt(0))
    ));
    const entries = raw.entries || [];
    if (entries.length) {
      const last = [...entries].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      document.getElementById('last-update').textContent = 'Ultima nota: ' + formatDate(last.date);
    }
    renderEntries(entries);
  } catch(e) { console.error(e); renderEntries(MOCK_ENTRIES); }
}

load();
</script>
</body>
</html>
