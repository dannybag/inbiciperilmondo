<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quante Storie · Una Bici per il Mondo</title>
<meta name="description" content="La rivista da sfogliare con le storie in sella di Una Bici per il Mondo: da Milano a Palermo, tappa dopo tappa.">
<meta property="og:title" content="Quante Storie · Una Bici per il Mondo">
<meta property="og:description" content="Da Milano a Palermo in bicicletta, tappa dopo tappa. Sfogliala.">
<link rel="icon" type="image/png" href="img/BikeIconBW.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;800;900&family=Barlow:wght@300;400;700&family=IBM+Plex+Mono:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="rivista1/rivista.css">
<style>
  :root { --orange: #F05A28; --ink: #FFF8F4; --muted: rgba(255,248,244,.55); }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: #111; color: var(--ink); font-family: 'IBM Plex Mono', monospace; display: flex; flex-direction: column; overflow: hidden;
    background-image: radial-gradient(ellipse 70% 55% at 50% 45%, rgba(240,90,40,.12), transparent 70%); }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: 8px; border-top: 4px solid var(--orange); }
  .brand { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 1.35rem; text-transform: uppercase; line-height: 1; color: var(--ink); text-decoration: none; }
  .brand span { color: var(--orange); }
  .issue { font-size: .66rem; letter-spacing: .25em; text-transform: uppercase; color: var(--orange); }
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .bar { display: flex; align-items: center; justify-content: center; gap: 10px 14px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 6px; }
  button { font: 500 .7rem/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1.5px solid var(--orange); padding: .65rem .95rem; border-radius: 2px; cursor: pointer; }
  button:hover { background: rgba(240,90,40,.16); }
  button:focus-visible { outline: 2px solid #FF8C5A; outline-offset: 2px; }
  button:disabled { opacity: .3; cursor: default; background: transparent; }
  button.quiet { border-color: rgba(255,248,244,.2); color: var(--muted); }
  .count { font-size: .76rem; letter-spacing: .1em; color: var(--muted); min-width: 6.5em; text-align: center; font-variant-numeric: tabular-nums; }
  .count b { color: var(--ink); font-weight: 500; }
  .hint { font-size: .62rem; letter-spacing: .1em; color: var(--muted); text-align: center; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); min-height: 1em; }
  .loading { color: var(--muted); font-size: .8rem; letter-spacing: .1em; }
  @media (max-width: 520px) { .issue { display: none; } button { padding: .6rem .75rem; } }
</style>
</head>
<body>
<header class="gut">
  <a class="brand" href="./">Una Bici per il <span>Mondo</span></a>
  <div class="issue">Quante Storie · Milano → Palermo</div>
</header>
<main class="stage gut" id="stage"><div class="loading" id="loading">Impagino la rivista…</div><div class="rv-book" id="book" role="region" aria-label="Rivista Quante Storie" hidden></div></main>
<div class="bar gut">
  <button id="prev" type="button" aria-label="Pagina precedente">← Indietro</button>
  <div class="count" id="count" aria-live="polite"></div>
  <button id="next" type="button" aria-label="Pagina successiva">Avanti →</button>
  <button id="pdf" type="button" class="quiet">Scarica PDF</button>
</div>
<div class="hint gut" id="hint"></div>

<script src="rivista1/rivista.js"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  let pages = [];
  const flip = Rivista.Flip($('stage'), $('book'), { prev: $('prev'), next: $('next'), count: $('count'), hint: $('hint') });
  try {
    const res = await fetch('rivista1/rivista.json?t=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    await Rivista.ready();
    pages = Rivista.paginate(data).pages;
    $('loading').hidden = true; $('book').hidden = false;
    flip.setPages(pages, 0);
  } catch (e) { $('loading').textContent = 'Non riesco a caricare la rivista. Riprova tra poco.'; }

  $('pdf').addEventListener('click', async () => {
    const b = $('pdf'); b.disabled = true;
    try {
      const blob = await Rivista.pdf(pages, (i, n) => { b.textContent = `Pagina ${i} di ${n}`; });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Quante-Storie.pdf';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    } catch (e) { alert('Il PDF non è venuto, riprova tra un momento.'); }
    finally { b.disabled = false; b.textContent = 'Scarica PDF'; }
  });
})();
</script>
</body>
</html>
