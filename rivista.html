<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quante Storie · Una Bici per il Mondo</title>
<meta name="description" content="La rivista da sfogliare con le storie in sella di Una Bici per il Mondo: da Milano a Palermo, tappa dopo tappa.">
<meta property="og:title" content="Quante Storie · Una Bici per il Mondo">
<meta property="og:description" content="Da Milano a Palermo in bicicletta, tappa dopo tappa. Sfogliala.">
<link rel="icon" type="image/png" href="img/BikeIconBW.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;800;900&family=Barlow:wght@300;400;700&family=IBM+Plex+Mono:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="rivista1/rivista.css">
<style>
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: #111; color: #FFF8F4; font-family: 'IBM Plex Mono', monospace; overflow: hidden; border-top: 3px solid #F05A28; box-sizing: border-box;
    background-image: radial-gradient(ellipse 70% 55% at 50% 45%, rgba(240,90,40,.12), transparent 70%); }
  /* la rivista occupa tutto lo schermo; su schermi larghi lascio ai lati lo spazio per le frecce */
  .stage { position: absolute; inset: 3px 0 0 0; display: flex; align-items: center; justify-content: center;
    padding: max(8px, env(safe-area-inset-top, 0px)) max(64px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(64px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
  .stage > .rv-book { flex: none; }
  .loading { color: rgba(255,248,244,.55); font-size: .8rem; letter-spacing: .1em; }
  .arrow { position: fixed; top: 50%; transform: translateY(-50%); z-index: 10; width: 48px; height: 48px; border-radius: 50%;
    border: 1.5px solid #F05A28; background: rgba(17,17,17,.6); color: #FFF8F4; font: 400 1.5rem/1 'Barlow', sans-serif;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0 0 3px; -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); transition: opacity .2s, background .2s; }
  .arrow:hover { background: #F05A28; }
  .arrow:focus-visible { outline: 2px solid #FF8C5A; outline-offset: 3px; }
  .arrow:disabled { opacity: 0; pointer-events: none; }
  #prev { left: max(8px, env(safe-area-inset-left, 0px)); }
  #next { right: max(8px, env(safe-area-inset-right, 0px)); }
  /* telefono: pagina il più grande possibile, frecce piccole sopra il bordo */
  @media (max-width: 700px) {
    .stage { padding: max(4px, env(safe-area-inset-top, 0px)) max(4px, env(safe-area-inset-right, 0px)) max(4px, env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
    .arrow { width: 38px; height: 38px; font-size: 1.25rem; background: rgba(17,17,17,.45); top: auto; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: none; }
    #prev { left: max(10px, env(safe-area-inset-left, 0px)); }
    #next { right: max(10px, env(safe-area-inset-right, 0px)); }
  }
</style>
</head>
<body>
<main class="stage" id="stage"><div class="loading" id="loading">Impagino la rivista…</div><div class="rv-book" id="book" role="region" aria-label="Rivista Quante Storie" hidden></div></main>
<button class="arrow" id="prev" type="button" aria-label="Pagina precedente">‹</button>
<button class="arrow" id="next" type="button" aria-label="Pagina successiva">›</button>

<script src="rivista1/rivista.js"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const flip = Rivista.Flip($('stage'), $('book'), { prev: $('prev'), next: $('next') });
  try {
    const res = await fetch('rivista1/rivista.json?t=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    await Rivista.ready();
    const pages = Rivista.paginate(data).pages;
    $('loading').hidden = true; $('book').hidden = false;
    flip.setPages(pages, 0);
  } catch (e) { $('loading').textContent = 'Non riesco a caricare la rivista. Riprova tra poco.'; }
})();
</script>
</body>
</html>
