name: Aggiorna raccolta fondi WBR

on:
  schedule:
    - cron: '0 * * * *'   # ogni ora
  push:
    branches: [ main ]
    paths:
      - 'tap.trigger'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright + Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Installa Playwright (solo se non in cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          npm install playwright @playwright/test
          npx playwright install chromium --with-deps

      - name: Leggi dati da WBR e aggiorna data.json
        run: |
          node << 'JSEOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            console.log('=== WBR Scraper v4 ===', new Date().toISOString());

            await page.goto('https://fund.worldbicyclerelief.org/en-GB/project/in-bici-per-il-mondo?tab=overview', {
              waitUntil: 'domcontentloaded', timeout: 30000
            });

            // Aspetta che la lista donatori sia effettivamente presente nel DOM
            try {
              await page.waitForSelector('ul.pagination, .donation-list, .supporters-list', { timeout: 8000 });
            } catch (e) {
              console.log('Nessun selettore paginazione trovato, procedo comunque');
            }
            await page.waitForTimeout(2000);

            // Snapshot pagina 1
            const allPageTexts = [await page.evaluate(() => document.body.innerText)];
            console.log('Pagina 1 caricata, chars:', allPageTexts[0].length);

            // Paginazione: clicca pagina 2, 3, ... finché esistono
            let pageNum = 2;
            while (pageNum <= 20) {
              const pageBtn = await page.$(
                `ul.pagination a:has-text("${pageNum}"), ` +
                `button:has-text("${pageNum}"), ` +
                `a[aria-label="Page ${pageNum}"]`
              );
              if (!pageBtn) { console.log('Nessun bottone per pagina', pageNum); break; }
              const isVisible = await pageBtn.isVisible();
              if (!isVisible) { console.log('Bottone pagina', pageNum, 'non visibile'); break; }

              console.log('Clicco pagina donatori #' + pageNum);
              await pageBtn.click();

              // Aspetta che il DOM si aggiorni: riprova fino a 5 secondi
              let newText = '';
              for (let attempt = 0; attempt < 5; attempt++) {
                await page.waitForTimeout(1000);
                newText = await page.evaluate(() => document.body.innerText);
                // Controlla che la pagina sia diversa dall'ultima (almeno 50 chars di differenza)
                const prev = allPageTexts[allPageTexts.length - 1];
                const diff = [...newText].filter((c, i) => c !== prev[i]).length;
                if (diff > 50) break;
                console.log('  Attesa aggiornamento DOM, tentativo', attempt + 1);
              }

              const eurLines = (newText.match(/^EUR/gim) || []).length;
              console.log('  Righe EUR trovate in pagina', pageNum, ':', eurLines);
              allPageTexts.push(newText);
              pageNum++;
            }

            console.log('Pagine totali caricate:', allPageTexts.length);

            // Raccolto e goal dalla prima pagina
            const bodyText = allPageTexts[0];
            let raised = 0, goal = 1700;
            const mRaised = bodyText.match(/EUR\s*([\d,.']+)\s*collected/i);
            if (mRaised) raised = parseInt(mRaised[1].replace(/[,.']/g, '')) || 0;
            const mGoal = bodyText.match(/EUR\s*([\d,.']+)\s*goal/i);
            if (mGoal) { const g = parseInt(mGoal[1].replace(/[,.']/g, '')) || 0; if (g > 0) goal = g; }
            console.log('Raccolto:', raised, '/ Goal:', goal);

            // --- PARSER DONATORI ---
            const TIME_UNITS = 'second|minute|hour|day|month|year';
            const MAX_TIME = { second: 59, minute: 59, hour: 23, day: 30, month: 12, year: 5 };

            function parseEurLine(raw) {
              const aboutM = raw.match(new RegExp(`(about\\s+\\d+\\s+(?:${TIME_UNITS})s?(?:\\s+ago)?)`, 'i'));
              if (aboutM) {
                const ts = raw.indexOf(aboutM[1]);
                const amount = parseInt(raw.slice(0, ts).replace(/[,.\']/g, '')) || 0;
                return { amount, time: aboutM[1].trim() };
              }
              const unitM = raw.match(new RegExp(`((?:${TIME_UNITS})s?(?:\\s+ago)?)`, 'i'));
              if (unitM) {
                const unitStart = raw.indexOf(unitM[0]);
                const before = raw.slice(0, unitStart).trim();
                const base = unitM[0].toLowerCase().replace(/s?\s*ago\s*$/, '').replace(/s$/, '').trim();
                const max = MAX_TIME[base] || 99;
                const shortUnits = ['second', 'minute', 'hour'];
                const digitOrder = shortUnits.some(u => base.startsWith(u)) ? [1, 2] : [2, 1];
                for (const digits of digitOrder) {
                  if (before.length > digits) {
                    const tnStr = before.slice(-digits);
                    if (tnStr.startsWith('0')) continue;
                    const tn = parseInt(tnStr);
                    if (tn > 0 && tn <= max) {
                      const amount = parseInt(before.slice(0, -digits).replace(/[,.\']/g, '')) || 0;
                      if (amount > 0) return { amount, time: tnStr + ' ' + unitM[0] };
                    }
                  }
                }
                const amount = parseInt(before.replace(/[,.\']/g, '')) || 0;
                return { amount, time: '' };
              }
              return { amount: parseInt(raw.replace(/[,.\']/g, '')) || 0, time: '' };
            }

            // Combina tutte le pagine, ma de-duplica il testo comune (header/footer)
            // Strategia: per ogni pagina successiva alla prima, prendi solo la parte
            // che inizia dalla lista donatori (dopo "Thanks to all supporters" o simile)
            function extractDonorSection(text) {
              const markers = [
                'Thanks to all supporters',
                'supporters',
                'contributions to this project'
              ];
              for (const marker of markers) {
                const idx = text.toLowerCase().indexOf(marker.toLowerCase());
                if (idx !== -1) return text.slice(idx);
              }
              return text;
            }

            const sections = allPageTexts.map((t, i) => i === 0 ? t : extractDonorSection(t));
            const combinedText = sections.join('\n');
            const lines = combinedText.split('\n').map(l => l.trim()).filter(Boolean);

            const donors = [];
            const seen = new Set();

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              if (!line.match(/^EUR\s*[\d,.']+/i)) continue;
              if (line.match(/collected|goal/i)) continue;

              const raw = line.replace(/^EUR\s*/i, '');
              const parsed = parseEurLine(raw);
              const amount = parsed.amount;
              const time = parsed.time;
              if (!amount) continue;

              const nameLine = (lines[i - 1] || '').trim();
              const name = (nameLine && !nameLine.match(/^EUR|collected|goal|donate|support|login|about|create|share|overview|update|description|english|^\d+%/i))
                ? nameLine : 'Anonymous';

              const nextLine = (lines[i + 1] || '').trim();
              const lineAfterNext = (lines[i + 2] || '').trim();
              const nextLineIsDonorName = lineAfterNext.match(/^EUR/i);
              const nextLineIsPagination = /^\d$/.test(nextLine);
              const message = (nextLine && !nextLineIsDonorName && !nextLineIsPagination &&
                !nextLine.match(/^EUR|collected|goal|donate|support|show|view|load|login|about|share|world bicycle relief|thanks to all|contributions/i))
                ? nextLine : '';

              const key = name === 'Anonymous'
                ? `anon|${amount}|${time || message}`
                : `${name}|${amount}|${message}`;
              if (seen.has(key)) continue;
              seen.add(key);

              donors.push({ name, amount, time, message });
              console.log(`+ ${name} | €${amount} | ${time || '?'} | "${message.slice(0, 40)}"`);
            }

            await browser.close();
            console.log('\nDonatori unici:', donors.length);

            let data = { fundraising: { raised: 0, goal: 1700 } };
            try { data = JSON.parse(fs.readFileSync('data.json', 'utf8')); } catch (e) {}

            const prevDonors = data.fundraising.donors || [];
            const changed = data.fundraising.raised !== raised
              || data.fundraising.goal !== goal
              || JSON.stringify(prevDonors) !== JSON.stringify(donors.length ? donors : prevDonors);

            data.fundraising.raised = raised;
            data.fundraising.goal = goal;
            if (donors.length > 0) data.fundraising.donors = donors;

            if (changed) {
              fs.writeFileSync('data.json', JSON.stringify(data, null, 2));
              console.log('✓ data.json aggiornato');
            } else {
              console.log('= Nessuna variazione');
            }

            const csvDonors = data.fundraising.donors || [];
            const rows = [['Nome', 'Importo', 'Tempo', 'Messaggio']];
            csvDonors.forEach(d => rows.push([d.name || '', d.amount || 0, d.time || '', d.message || '']));
            const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
            fs.writeFileSync('sostenitori-mipa.csv', csv, 'utf8');
            console.log('✓ sostenitori-mipa.csv generato (' + csvDonors.length + ' righe)');
          })();
          JSEOF

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet data.json sostenitori-mipa.csv || (
            git add data.json sostenitori-mipa.csv &&
            git commit -m "Auto: aggiornamento raccolta fondi WBR" &&
            git pull --rebase &&
            git push
          )
