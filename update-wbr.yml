name: Aggiorna raccolta fondi WBR

on:
  schedule:
    - cron: '0 * * * *'   # ogni ora (sufficiente per raccolta fondi, sicuro per GitHub)
  push:
    branches: [ main ]
    paths:
      - 'tap.trigger'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright + Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Installa Playwright (solo se non in cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          npm install playwright @playwright/test
          npx playwright install chromium --with-deps

      - name: Leggi dati da WBR e aggiorna data.json
        run: |
          cat << 'EOF' > fetch_wbr.js
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();

            console.log('--- WBR Fundraising Scraper ---');
            console.log('Data/ora:', new Date().toISOString());

            await page.goto('https://fund.worldbicyclerelief.org/en-GB/project/in-bici-per-il-mondo?tab=overview', {
              waitUntil: 'networkidle',
              timeout: 30000
            });

            const bodyText = await page.evaluate(() => document.body.innerText);

            // Log più lungo per debug donatori
            console.log('\n--- TESTO PAGINA (prime 4000 chars) ---');
            console.log(bodyText.slice(0, 4000));

            // ---- IMPORTO RACCOLTO ----
            let raised = 0;
            let goal = 1700;

            const collectedMatch = bodyText.match(/(?:EUR|€|euro)?\s*([\d,.']+)\s*collected/i);
            if (collectedMatch) {
              raised = parseInt(collectedMatch[1].replace(/[,.']/g, '')) || 0;
              console.log('\nRaccolto:', raised);
            }
            const goalMatch = bodyText.match(/(?:EUR|€|euro)?\s*([\d,.']+)\s*goal/i);
            if (goalMatch) {
              const g = parseInt(goalMatch[1].replace(/[,.']/g, '')) || 0;
              if (g > 0) goal = g;
            }

            // ---- LISTA DONATORI (parser testuale) ----
            // Formato atteso nel bodyText:
            //   NomeCognome
            //   EUR 20about 7 hours
            //   Messaggio opzionale
            console.log('\n--- Parsing donatori ---');
            const donors = [];
            const seen = new Set();

            // Trova ogni riga con "EUR" seguita da un importo
            const lines = bodyText.split('\n').map(l => l.trim()).filter(Boolean);

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              // Riga con EUR + importo (es. "EUR 20about 7 hours" o "EUR 147")
              const eurMatch = line.match(/^EUR\s*([\d,.']+)(.*)?$/i);
              if (!eurMatch) continue;

              const amount = parseInt(eurMatch[1].replace(/[,.']/g, '')) || 0;
              if (amount === 0) continue;

              // Tempo: estratto dalla stessa riga dopo l'importo (es. "about 7 hours", "6 days")
              const timeRaw = (eurMatch[2] || '').trim();
              const timeMatch = timeRaw.match(/(?:about\s+)?(\d+\s+(?:second|minute|hour|day|month|year)s?(?:\s+ago)?|\d+[smhd])/i);
              const time = timeMatch ? timeMatch[0].trim() : timeRaw.slice(0, 30).trim();

              // Nome: riga precedente (se non è EUR o messaggio di sistema)
              const nameLine = lines[i - 1] || '';
              const name = (nameLine && !nameLine.match(/EUR|collected|goal|donate|support/i))
                ? nameLine : 'Anonymous';

              // Messaggio: riga successiva (se non inizia con EUR e non sembra navigazione)
              const nextLine = lines[i + 1] || '';
              const message = (nextLine && !nextLine.match(/^EUR|collected|goal|donate|support|show|view|load/i))
                ? nextLine : '';

              // Deduplicazione: chiave = nome + importo + messaggio
              const key = `${name}|${amount}|${message}`;
              if (seen.has(key)) continue;
              seen.add(key);

              donors.push({ name, amount, time, message });
              console.log(` + ${name}: €${amount} (${time || '?'}) ${message ? '"' + message.slice(0,40) + '"' : ''}`);
            }

            await browser.close();

            console.log('\nDonatori unici trovati:', donors.length);
            console.log('Raccolto: €' + raised, '/ Goal: €' + goal);

            // Leggi data.json
            let data = { fundraising: { raised: 0, goal: 1700 }, tappa: {} };
            try {
              data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            } catch(e) {
              console.log('data.json non trovato, uso default');
            }

            const prevRaised = data.fundraising.raised;
            const prevDonors = JSON.stringify(data.fundraising.donors || []);

            data.fundraising.raised = raised;
            data.fundraising.goal = goal;
            if (donors.length > 0) data.fundraising.donors = donors;

            const changed = prevRaised !== raised || prevDonors !== JSON.stringify(data.fundraising.donors);
            if (changed) {
              fs.writeFileSync('data.json', JSON.stringify(data, null, 2));
              console.log('✓ data.json aggiornato');
            } else {
              console.log('= Nessuna variazione');
            }
          })();
          EOF
          node fetch_wbr.js

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet data.json || (
            git add data.json &&
            git commit -m "Auto: aggiornamento raccolta fondi WBR" &&
            git pull --rebase &&
            git push
          )
