name: Aggiorna raccolta fondi WBR

on:
  schedule:
    - cron: '0 * * * *'   # ogni ora
  push:
    branches: [ main ]
    paths:
      - 'tap.trigger'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright + Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Installa Playwright (solo se non in cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          npm install playwright @playwright/test
          npx playwright install chromium --with-deps

      - name: Leggi dati da WBR e aggiorna data.json
        run: |
          node << 'JSEOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            console.log('=== WBR Scraper v3 ===', new Date().toISOString());

            await page.goto('https://fund.worldbicyclerelief.org/en-GB/project/in-bici-per-il-mondo?tab=overview', {
              waitUntil: 'networkidle', timeout: 30000
            });

            const bodyText = await page.evaluate(() => document.body.innerText);

            // Stampa tutto il testo per debug
            console.log('\n=== TESTO COMPLETO (10000 chars) ===');
            console.log(bodyText.slice(0, 10000));
            console.log('=== FINE TESTO ===\n');

            // --- RACCOLTO E GOAL ---
            let raised = 0, goal = 1700;
            const mRaised = bodyText.match(/EUR\s*([\d,.']+)\s*collected/i);
            if (mRaised) raised = parseInt(mRaised[1].replace(/[,.']/g, '')) || 0;
            const mGoal = bodyText.match(/EUR\s*([\d,.']+)\s*goal/i);
            if (mGoal) { const g = parseInt(mGoal[1].replace(/[,.']/g, '')) || 0; if (g > 0) goal = g; }
            console.log('Raccolto:', raised, '/ Goal:', goal);

            // --- DONATORI ---
            // Formato nel testo: "EUR 147about 10 hours" o "EUR 1476 days"
            // dove amount e time sono concatenati senza spazio
            const TIME_UNITS = 'second|minute|hour|day|month|year';
            // Singola cifra per time concatenato (es "1476 days" → "6 days"), \d+ per "about X"
            const TIME_RE = new RegExp(
              `(about\\s+\\d+\\s+(?:${TIME_UNITS})s?(?:\\s+ago)?|\\d\\s+(?:${TIME_UNITS})s?(?:\\s+ago)?)`, 'i'
            );

            const lines = bodyText.split('\n').map(l => l.trim()).filter(Boolean);
            const donors = [];
            const seen = new Set();
            let anonCount = 0;

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              if (!line.match(/^EUR\s*[\d,'.']+/i)) continue;
              // Salta righe di sistema (raccolto/goal)
              if (line.match(/collected|goal/i)) continue;

              // Prova a separare importo e tempo dalla stessa riga
              // es "1476 days" → amount=147, time="6 days"
              // es "20about 7 hours" → amount=20, time="about 7 hours"
              const raw = line.replace(/^EUR\s*/i, '');
              const timeInRaw = raw.match(TIME_RE);
              let amount, time;
              if (timeInRaw) {
                const timeStart = raw.indexOf(timeInRaw[1]);
                amount = parseInt(raw.slice(0, timeStart).replace(/[,.']/g, '')) || 0;
                time = timeInRaw[1].trim();
              } else {
                amount = parseInt(raw.replace(/[,.']/g, '')) || 0;
                time = '';
              }
              if (!amount) continue;

              // Nome: riga precedente
              const nameLine = (lines[i-1] || '').trim();
              const name = (nameLine && !nameLine.match(/^EUR|collected|goal|donate|support|login|about|create|share|overview|update|description|english|^\d+%/i))
                ? nameLine : 'Anonymous';

              // Messaggio: riga successiva
              const nextLine = (lines[i+1] || '').trim();
              const message = (nextLine && !nextLine.match(/^EUR|collected|goal|donate|support|show|view|load|login|about|share|world bicycle relief/i))
                ? nextLine : '';

              // Deduplicazione:
              // - Donatori con nome: chiave = nome|importo|messaggio
              // - Anonymous: chiave = importo|tempo (identità reale del donatore)
              //   se tempo vuoto, usa importo|messaggio come fallback
              const key = name === 'Anonymous'
                ? `anon|${amount}|${time || message}`
                : `${name}|${amount}|${message}`;
              if (seen.has(key)) continue;
              seen.add(key);

              donors.push({ name, amount, time, message });
              console.log(`+ ${name} | €${amount} | ${time || '?'} | "${message.slice(0,40)}"`);
            }

            await browser.close();
            console.log('\nDonatori unici:', donors.length);

            let data = { fundraising: { raised: 0, goal: 1700 } };
            try { data = JSON.parse(fs.readFileSync('data.json', 'utf8')); } catch(e) {}

            const changed = data.fundraising.raised !== raised
              || data.fundraising.goal !== goal
              || JSON.stringify(data.fundraising.donors||[]) !== JSON.stringify(donors.length ? donors : data.fundraising.donors||[]);

            data.fundraising.raised = raised;
            data.fundraising.goal = goal;
            if (donors.length > 0) data.fundraising.donors = donors;

            if (changed) {
              fs.writeFileSync('data.json', JSON.stringify(data, null, 2));
              console.log('✓ data.json aggiornato');
            } else {
              console.log('= Nessuna variazione');
            }
          })();
          JSEOF

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet data.json || (
            git add data.json &&
            git commit -m "Auto: aggiornamento raccolta fondi WBR" &&
            git pull --rebase &&
            git push
          )
