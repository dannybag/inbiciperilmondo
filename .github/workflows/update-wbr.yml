name: Aggiorna raccolta fondi WBR

on:
  schedule:
    - cron: '0 * * * *'   # ogni ora (sufficiente per raccolta fondi, sicuro per GitHub)
  push:
    branches: [ main ]
    paths:
      - 'tap.trigger'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright + Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Installa Playwright (solo se non in cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          npm install playwright @playwright/test
          npx playwright install chromium --with-deps

      - name: Leggi dati da WBR e aggiorna data.json
        run: |
          cat << 'EOF' > fetch_wbr.js
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();

            console.log('--- WBR Fundraising Scraper ---');
            console.log('Data/ora:', new Date().toISOString());

            await page.goto('https://fund.worldbicyclerelief.org/en-GB/project/in-bici-per-il-mondo?tab=overview', {
              waitUntil: 'networkidle',
              timeout: 30000
            });

            // Dump testo visibile per debug
            const bodyText = await page.evaluate(() => document.body.innerText);
            console.log('\n--- TESTO PAGINA ---');
            console.log(bodyText.slice(0, 2000));

            // ---- IMPORTO RACCOLTO ----
            let raised = 0;
            let goal = 1700;

            const collectedMatch = bodyText.match(/(?:EUR|€|euro)?\s*([\d,.']+)\s*collected/i);
            if (collectedMatch) {
              raised = parseInt(collectedMatch[1].replace(/[,.']/g, '')) || 0;
              console.log('\nTrovato "collected":', collectedMatch[0], '→ €' + raised);
            } else {
              console.log('\n⚠ Pattern "collected" non trovato nel testo');
            }

            const goalMatch = bodyText.match(/(?:EUR|€|euro)?\s*([\d,.']+)\s*goal/i);
            if (goalMatch) {
              const g = parseInt(goalMatch[1].replace(/[,.']/g, '')) || 0;
              if (g > 0) goal = g;
              console.log('Trovato "goal":', goalMatch[0], '→ €' + goal);
            }

            // ---- LISTA DONATORI ----
            console.log('\n--- Scraping donatori ---');
            const donors = await page.evaluate(() => {
              const results = [];
              // Prova selettori comuni per liste donatori su piattaforme fundraising
              const selectors = [
                '[class*="donor"]', '[class*="donation"]', '[class*="supporter"]',
                '[class*="backer"]', '[class*="pledge"]', '[class*="contribution"]'
              ];
              let items = [];
              for (const sel of selectors) {
                items = document.querySelectorAll(sel);
                if (items.length > 0) break;
              }
              // Fallback: cerca per pattern testo EUR nel DOM
              if (items.length === 0) {
                const allEls = document.querySelectorAll('li, [class*="item"], [class*="row"]');
                items = [...allEls].filter(el => /EUR\s*\d+/.test(el.textContent));
              }
              items.forEach(el => {
                const text = el.innerText || el.textContent || '';
                const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
                if (!lines.length) return;

                // Cerca importo EUR
                const amountMatch = text.match(/EUR\s*([\d,.']+)/i);
                if (!amountMatch) return;
                const amount = parseInt(amountMatch[1].replace(/[,.']/g, '')) || 0;

                // Prima riga non-amount = nome
                const name = lines.find(l => !l.match(/EUR|€|\d+\s*(hours?|days?|months?|minutes?|ago)/i)) || 'Anonymous';

                // Cerca tempo (es. "about 7 hours", "6 days", "2 months")
                const timeMatch = text.match(/(?:about\s+)?(\d+\s+(?:hours?|days?|months?|minutes?)\s*ago?|\d+[hd])/i);
                const time = timeMatch ? timeMatch[0].trim() : '';

                // Messaggio: riga non nome, non amount, non time
                const msg = lines.find(l =>
                  l !== name &&
                  !l.match(/EUR|€/) &&
                  !l.match(/(?:about\s+)?\d+\s+(?:hours?|days?|months?)/i)
                ) || '';

                results.push({ name, amount, time, message: msg });
              });
              return results;
            });

            console.log('Donatori trovati:', donors.length);
            donors.forEach(d => console.log(` - ${d.name}: €${d.amount} (${d.time}) ${d.message ? '"' + d.message.slice(0,40) + '"' : ''}`));

            await browser.close();

            console.log('\n--- RISULTATO ---');
            console.log('Importo raccolto: €' + raised);
            console.log('Goal: €' + goal);

            // Leggi data.json corrente
            let data = { fundraising: { raised: 0, goal: 1700 }, tappa: {} };
            try {
              data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
              console.log('Valore attuale in data.json: €' + data.fundraising.raised);
            } catch(e) {
              console.log('data.json non trovato, uso default');
            }

            // Aggiorna raised, goal e donatori
            const raisedChanged = raised !== data.fundraising.raised || goal !== data.fundraising.goal;
            if (raisedChanged) {
              data.fundraising.raised = raised;
              data.fundraising.goal = goal;
            }

            // Salva donatori sempre se ne troviamo
            let donorsChanged = false;
            if (donors.length > 0) {
              const prev = JSON.stringify(data.fundraising.donors || []);
              data.fundraising.donors = donors;
              donorsChanged = prev !== JSON.stringify(donors);
            }

            if (raisedChanged || donorsChanged) {
              fs.writeFileSync('data.json', JSON.stringify(data, null, 2));
              console.log('✓ data.json aggiornato (raised:' + raisedChanged + ' donors:' + donorsChanged + ')');
            } else {
              console.log('= Nessuna variazione');
            }
          })();
          EOF
          node fetch_wbr.js

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet data.json || (
            git add data.json &&
            git commit -m "Auto: aggiornamento raccolta fondi WBR" &&
            git pull --rebase &&
            git push
          )
