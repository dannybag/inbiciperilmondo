name: Traduci Diario (DeepL)

on:
  repository_dispatch:
    types: [translate-diario]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Traduci voci mancanti
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/translate-diario.js

      - name: Commit traduzioni
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diario.json
          git diff --staged --quiet || git commit -m "Auto: traduzione EN diario"
          git push
