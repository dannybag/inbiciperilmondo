<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@dannybag · Il Viaggio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --orange: #F05A28;
    --dark:   #1A1A1A;
    --cream:  #FFF8F4;
    --mono:   'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: #111;
    border-bottom: 2px solid var(--orange);
    padding: 1rem 5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    color: var(--orange);
  }
  .header-title span { color: var(--cream); }

  /* STATS BAR */
  .stats-bar {
    background: #111;
    padding: 1rem 5vw;
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    border-bottom: 1px solid rgba(240,90,40,0.2);
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }
  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--orange);
    line-height: 1;
  }
  .stat-label {
    font-family: var(--mono);
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,248,244,0.4);
  }
  .stat-sub {
    font-family: var(--mono);
    font-size: 0.6rem;
    color: rgba(255,248,244,0.25);
  }

  /* MAP */
  #map {
    height: 55vh;
    width: 100%;
    background: #0A0A0A;
  }
  .leaflet-tile-pane { filter: grayscale(30%) brightness(0.85); }

  /* TAPPE LIST */
  .tappe-section {
    padding: 2rem 5vw;
  }
  .section-label {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 1rem;
  }
  .tappe-table {
    width: 100%;
    border-collapse: collapse;
  }
  .tappe-table th {
    font-family: var(--mono);
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,248,244,0.3);
    text-align: left;
    padding: 0.5rem 0.8rem;
    border-bottom: 1px solid rgba(255,248,244,0.08);
  }
  .tappe-table td {
    padding: 0.7rem 0.8rem;
    border-bottom: 1px solid rgba(255,248,244,0.06);
    font-size: 0.85rem;
    vertical-align: middle;
  }
  .tappe-table tr:hover td { background: rgba(240,90,40,0.05); }
  .td-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    color: var(--orange);
    width: 2.5rem;
  }
  .td-date {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: rgba(255,248,244,0.45);
    white-space: nowrap;
  }
  .td-name { font-weight: 600; max-width: 200px; }
  .td-km {
    font-family: var(--mono);
    font-size: 0.75rem;
    white-space: nowrap;
  }
  .td-dis {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: rgba(255,248,244,0.5);
    white-space: nowrap;
  }
  .td-tot {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: rgba(255,248,244,0.3);
    white-space: nowrap;
  }

  /* ADMIN FAB */
  .fab {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    z-index: 1000;
  }
  .fab-btn {
    width: 3.2rem; height: 3.2rem;
    background: var(--orange);
    border: none;
    border-radius: 50%;
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(240,90,40,0.4);
    display: flex; align-items: center; justify-content: center;
  }
  .fab-menu {
    display: none;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 0.8rem;
    align-items: flex-end;
  }
  .fab-menu.open { display: flex; }
  .fab-item {
    background: #1A1A1A;
    border: 1px solid rgba(240,90,40,0.5);
    color: var(--cream);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  /* ADMIN OVERLAY */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }
  .overlay.open { display: flex; }
  .panel {
    background: #1A1A1A;
    border: 1px solid rgba(240,90,40,0.4);
    border-radius: 8px;
    padding: 1.5rem;
    width: 480px;
    max-width: 94vw;
    max-height: 88vh;
    overflow-y: auto;
  }
  .panel-title {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 1rem;
  }
  .panel label {
    font-family: var(--mono);
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,248,244,0.4);
    display: block;
    margin-bottom: 0.3rem;
    margin-top: 0.8rem;
  }
  .panel input, .panel select {
    width: 100%;
    background: #2A2A2A;
    border: 1px solid rgba(240,90,40,0.3);
    color: var(--cream);
    font-family: 'Barlow', sans-serif;
    font-size: 0.9rem;
    padding: 0.5rem 0.7rem;
    border-radius: 4px;
    outline: none;
  }
  .btn-primary {
    width: 100%;
    background: var(--orange);
    color: var(--cream);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.7rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 1rem;
  }
  .btn-ghost {
    width: 100%;
    background: transparent;
    color: rgba(255,248,244,0.3);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.6rem;
    border: 1px solid rgba(255,248,244,0.15);
    border-radius: 4px;
    cursor: pointer;
    margin-top: 0.5rem;
  }
  .msg { font-family: var(--mono); font-size: 0.65rem; color: rgba(255,248,244,0.4); margin-top: 0.5rem; min-height: 1.2rem; }
  .strava-list { max-height: 200px; overflow-y: auto; margin-top: 0.5rem; }
  .strava-item {
    display: block; width: 100%; text-align: left;
    background: transparent; border: none;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: var(--cream); font-family: 'Barlow', sans-serif;
    font-size: 0.85rem; padding: 0.5rem 0.6rem; cursor: pointer;
  }
  .strava-item:hover { background: rgba(240,90,40,0.08); }
  .strava-item-date { font-family: var(--mono); font-size: 0.6rem; color: var(--orange); }
  .strava-item-stats { font-family: var(--mono); font-size: 0.6rem; color: rgba(255,248,244,0.35); }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: rgba(255,248,244,0.2);
    text-transform: uppercase;
  }

  @media (max-width: 600px) {
    .stats-bar { gap: 1rem; }
    .stat-value { font-size: 1.5rem; }
    .td-tot, .td-dis { display: none; }
    #map { height: 40vh; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">@danny<span>bag</span> · Il Viaggio</div>
  <div style="font-family:var(--mono); font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,248,244,0.3);" id="last-update"></div>
</div>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-value" id="stat-tappe">0</div>
    <div class="stat-label">Tappe</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-km">0</div>
    <div class="stat-label">Km totali</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-dis">0</div>
    <div class="stat-label">Dislivello ↑</div>
    <div class="stat-sub">metri</div>
  </div>
  <div class="stat" style="margin-left:auto;">
    <div class="stat-value" style="font-size:1.2rem; color:rgba(255,248,244,0.3);" id="stat-remaining">—</div>
    <div class="stat-label">Km al traguardo</div>
    <div class="stat-sub">su 1.700 km totali</div>
  </div>
</div>

<div id="map"></div>

<div class="tappe-section">
  <div class="section-label">Tappe percorse</div>
  <div id="empty-state" class="empty-state">Nessuna tappa ancora · aggiungi la prima da Strava ⚙</div>
  <table class="tappe-table" id="tappe-table" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>Data</th>
        <th>Nome</th>
        <th>Km</th>
        <th>↑ m</th>
        <th>Tot. km</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tappe-body"></tbody>
  </table>
</div>

<!-- FAB -->
<div class="fab">
  <div class="fab-menu" id="fab-menu">
    <button class="fab-item" onclick="openPanel('strava-panel')">⚡ Aggiungi da Strava</button>
    <button class="fab-item" onclick="openPanel('token-panel')">🔑 Token GitHub</button>
  </div>
  <button class="fab-btn" onclick="toggleFab()">⚙️</button>
</div>

<!-- PANEL: STRAVA -->
<div class="overlay" id="strava-panel">
  <div class="panel">
    <div class="panel-title">⚡ Aggiungi tappa da Strava</div>
    <button onclick="stravaLoadList()" class="btn-primary" style="margin-top:0;">Carica ultime 40 attività</button>
    <div class="msg" id="strava-panel-msg"></div>
    <div class="strava-list" id="strava-list"></div>
    <button onclick="closePanel('strava-panel')" class="btn-ghost">Chiudi</button>
  </div>
</div>

<!-- PANEL: TOKEN -->
<div class="overlay" id="token-panel">
  <div class="panel">
    <div class="panel-title">🔑 Token GitHub</div>
    <label>Personal Access Token</label>
    <input type="password" id="gh-token-input" placeholder="ghp_...">
    <button onclick="saveToken()" class="btn-primary">Salva token</button>
    <div class="msg" id="token-msg"></div>
    <button onclick="closePanel('token-panel')" class="btn-ghost">Chiudi</button>
  </div>
</div>

<script>
// ---- CONFIG ----
const GH_OWNER = 'dannybag';
const GH_REPO  = 'inbiciperilmondo';
const GH_FILE  = 'tappe.json';
const GH_API   = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;
const TOTAL_KM  = 1700;

// Strava (offuscato)
const _si = [57,60,60,57,64,64];
const _ss = [63,57,106,104,109,59,107,60,105,56,58,64,60,108,109,62,105,104,60,59,107,58,57,104,105,104,56,58,56,58,60,62,109,109,63,62,109,62,107,57];
const _dec = a => a.map(c => String.fromCharCode(c - 7)).join('');
const STRAVA_REDIRECT = window.location.href.split('?')[0];

let tappe = [];
let ghSha = null;
let map, routeLayer;

// ---- MAP ----
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([44.5, 11.3], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 18
  }).addTo(map);
  routeLayer = L.layerGroup().addTo(map);
}

// Decodifica Google Polyline
function decodePolyline(encoded) {
  const pts = [];
  let idx = 0, lat = 0, lng = 0;
  while (idx < encoded.length) {
    let b, shift = 0, result = 0;
    do { b = encoded.charCodeAt(idx++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);
    shift = 0; result = 0;
    do { b = encoded.charCodeAt(idx++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);
    pts.push([lat / 1e5, lng / 1e5]);
  }
  return pts;
}

function renderMap() {
  routeLayer.clearLayers();
  if (!tappe.length) return;

  const allPoints = [];
  tappe.forEach((t, i) => {
    if (t.polyline) {
      const pts = decodePolyline(t.polyline);
      if (pts.length) {
        L.polyline(pts, {
          color: '#F05A28',
          weight: 3,
          opacity: 0.85
        }).bindTooltip(`${i+1}. ${t.name}<br>${t.km} km`, { sticky: true }).addTo(routeLayer);
        allPoints.push(...pts);

        // Marker primo e ultimo punto
        const iconOpts = (num) => L.divIcon({
          html: `<div style="background:#F05A28;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:0.7rem;width:1.4rem;height:1.4rem;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #fff;">${num}</div>`,
          className: '', iconSize: [22, 22], iconAnchor: [11, 11]
        });
        L.marker(pts[0], { icon: iconOpts(i+1) }).addTo(routeLayer);
      }
    }
  });

  if (allPoints.length) {
    map.fitBounds(L.latLngBounds(allPoints), { padding: [30, 30] });
  }
}

// ---- STATS + TABLE ----
function renderStats() {
  const n   = tappe.length;
  const km  = tappe.reduce((s, t) => s + (t.km  || 0), 0);
  const dis = tappe.reduce((s, t) => s + (t.dis || 0), 0);

  document.getElementById('stat-tappe').textContent = n;
  document.getElementById('stat-km').textContent    = km.toLocaleString('it-IT');
  document.getElementById('stat-dis').textContent   = dis.toLocaleString('it-IT');
  document.getElementById('stat-remaining').textContent = Math.max(0, TOTAL_KM - km).toLocaleString('it-IT');
}

function renderTable() {
  const body  = document.getElementById('tappe-body');
  const table = document.getElementById('tappe-table');
  const empty = document.getElementById('empty-state');

  if (!tappe.length) { table.style.display = 'none'; empty.style.display = 'block'; return; }
  table.style.display = 'table'; empty.style.display = 'none';

  let totKm = 0, totDis = 0;
  body.innerHTML = tappe.map((t, i) => {
    totKm  += t.km  || 0;
    totDis += t.dis || 0;
    const date = t.date ? new Date(t.date).toLocaleDateString('it-IT', { day:'2-digit', month:'short' }) : '—';
    return `<tr>
      <td class="td-num">${i+1}</td>
      <td class="td-date">${date}</td>
      <td class="td-name">${t.name || '—'}</td>
      <td class="td-km">${t.km || 0} km</td>
      <td class="td-dis">↑${t.dis || 0}m</td>
      <td class="td-tot">${totKm} km</td>
      <td style="text-align:right;">
        <button onclick="deleteTappa(${i})" style="background:none;border:none;color:rgba(255,255,255,0.2);cursor:pointer;font-size:0.8rem;">✕</button>
      </td>
    </tr>`;
  }).join('');
}

function render() {
  renderStats();
  renderTable();
  renderMap();
}

// ---- GITHUB ----
function getToken() { return localStorage.getItem('viaggio-gh-token') || ''; }

async function loadFromGitHub() {
  const token = getToken();
  const headers = token ? { Authorization: `token ${token}` } : {};
  try {
    const res = await fetch(GH_API + '?t=' + Date.now(), { headers, cache: 'no-store' });
    if (res.status === 404) { render(); return; }
    if (!res.ok) return;
    const d = await res.json();
    ghSha = d.sha;
    const raw = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(d.content.replace(/\n/g,'')), c => c.charCodeAt(0))));
    tappe = raw.tappe || [];
    if (raw.updated) document.getElementById('last-update').textContent = 'Aggiornato: ' + new Date(raw.updated).toLocaleString('it-IT');
    render();
  } catch(e) { console.error(e); render(); }
}

async function saveToGitHub() {
  const token = getToken();
  if (!token) { alert('Inserisci il token GitHub prima di salvare.'); openPanel('token-panel'); return; }
  const payload = { tappe, updated: new Date().toISOString() };
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
  const body = { message: 'Aggiorna tappe ' + new Date().toISOString().slice(0,10), content };
  if (ghSha) body.sha = ghSha;
  const res = await fetch(GH_API, {
    method: 'PUT',
    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json', Accept: 'application/vnd.github.v3+json' },
    body: JSON.stringify(body)
  });
  if (res.ok) { const d = await res.json(); ghSha = d.content.sha; return true; }
  console.error('Save failed', await res.text()); return false;
}

async function deleteTappa(idx) {
  if (!confirm(`Eliminare la tappa ${idx+1}?`)) return;
  tappe.splice(idx, 1);
  render();
  await saveToGitHub();
}

// ---- STRAVA ----
async function stravaGetToken() {
  const expiry = parseInt(localStorage.getItem('strava-expiry') || '0');
  if (Date.now() / 1000 < expiry - 60) return localStorage.getItem('strava-access');
  const refresh = localStorage.getItem('strava-refresh');
  if (!refresh) return null;
  const res = await fetch('https://www.strava.com/oauth/token', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ client_id: _dec(_si), client_secret: _dec(_ss), refresh_token: refresh, grant_type: 'refresh_token' })
  });
  const d = await res.json();
  if (d.access_token) {
    localStorage.setItem('strava-access', d.access_token);
    localStorage.setItem('strava-refresh', d.refresh_token);
    localStorage.setItem('strava-expiry', d.expires_at);
    return d.access_token;
  }
  return null;
}

async function stravaLoadList() {
  const msg  = document.getElementById('strava-panel-msg');
  const list = document.getElementById('strava-list');
  msg.textContent = 'Caricamento...';
  list.innerHTML = '';
  const token = await stravaGetToken();
  if (!token) { msg.textContent = '✗ Strava non connesso. Vai su index.html e connetti Strava.'; return; }
  const res = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=40', {
    headers: { Authorization: `Bearer ${token}` }
  });
  const acts = await res.json();
  if (!acts || !acts.length) { msg.textContent = '✗ Nessuna attività trovata'; return; }
  msg.textContent = `${acts.length} attività trovate · seleziona quella da aggiungere`;
  list.innerHTML = acts.map((a, i) => {
    const km  = Math.round(a.distance / 1000);
    const dis = Math.round(a.total_elevation_gain);
    const date = new Date(a.start_date_local).toLocaleDateString('it-IT', { day:'2-digit', month:'short', year:'2-digit' });
    return `<button class="strava-item" onclick="addFromStrava(${i})">
      <span class="strava-item-date">${date}</span>
      <span style="margin-left:0.6rem;">${a.name}</span><br>
      <span class="strava-item-stats">${km} km · ↑${dis}m</span>
    </button>`;
  }).join('');
  window._stravaActs = acts;
}

async function addFromStrava(idx) {
  const msg = document.getElementById('strava-panel-msg');
  const act = window._stravaActs[idx];
  msg.textContent = 'Carico dettagli traccia GPS...';

  // Fetch full activity for detailed polyline
  const token = await stravaGetToken();
  let polyline = act.map?.summary_polyline || '';
  try {
    const detRes = await fetch(`https://www.strava.com/api/v3/activities/${act.id}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const det = await detRes.json();
    polyline = det.map?.polyline || det.map?.summary_polyline || polyline;
  } catch(e) {}

  const tappa = {
    id:       act.id,
    name:     act.name,
    date:     act.start_date_local,
    km:       Math.round(act.distance / 1000),
    dis:      Math.round(act.total_elevation_gain),
    polyline
  };

  // Controlla duplicati
  if (tappe.find(t => t.id === act.id)) { msg.textContent = '⚠ Tappa già presente'; return; }

  tappe.push(tappa);
  tappe.sort((a, b) => new Date(a.date) - new Date(b.date));
  render();

  msg.textContent = 'Salvataggio su GitHub...';
  const ok = await saveToGitHub();
  msg.textContent = ok ? `✓ Tappa aggiunta · ${tappa.km} km · ↑${tappa.dis}m` : '✗ Errore salvataggio';
}

// ---- UI ----
function toggleFab() {
  document.getElementById('fab-menu').classList.toggle('open');
}
function openPanel(id) {
  document.getElementById(id).classList.add('open');
  document.getElementById('fab-menu').classList.remove('open');
}
function closePanel(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

function saveToken() {
  const t = document.getElementById('gh-token-input').value.trim();
  if (!t) return;
  localStorage.setItem('viaggio-gh-token', t);
  document.getElementById('token-msg').textContent = '✓ Token salvato';
  setTimeout(() => closePanel('token-panel'), 800);
}

// ---- STRAVA OAUTH CALLBACK ----
(async function() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (!code) return;
  window.history.replaceState({}, '', window.location.pathname);
  const res = await fetch('https://www.strava.com/oauth/token', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ client_id: _dec(_si), client_secret: _dec(_ss), code, grant_type: 'authorization_code' })
  });
  const d = await res.json();
  if (d.refresh_token) {
    localStorage.setItem('strava-access', d.access_token);
    localStorage.setItem('strava-refresh', d.refresh_token);
    localStorage.setItem('strava-expiry', d.expires_at);
  }
})();

initMap();
