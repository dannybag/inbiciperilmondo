<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@dannybag · Il Viaggio</title>
<link rel="icon" type="image/png" href="img/BikeIconBW.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root { --orange:#F05A28; --dark:#1A1A1A; --cream:#FFF8F4; --mono:'IBM Plex Mono',monospace; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--dark); color:var(--cream); font-family:'Barlow',sans-serif; min-height:100vh; }

  .header {
    background:#111;
    border-bottom:2px solid var(--orange);
    padding:1rem 5vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:0.5rem;
  }
  .header-title { font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:0.08em; color:var(--orange); }
  .header-title span { color:var(--cream); }
  .header-sub { font-family:var(--mono); font-size:0.55rem; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,248,244,0.3); }

  /* STATS */
  .stats-bar {
    background:#111;
    padding:1rem 5vw;
    display:flex;
    gap:2rem;
    flex-wrap:wrap;
    border-bottom:1px solid rgba(240,90,40,0.2);
    align-items:flex-end;
  }
  .stat { display:flex; flex-direction:column; gap:0.1rem; }
  .stat-value { font-family:'Bebas Neue',sans-serif; font-size:2rem; color:var(--orange); line-height:1; }
  .stat-label { font-family:var(--mono); font-size:0.55rem; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,248,244,0.4); }

  /* PROGRESS BAR */
  .progress-wrap {
    padding:1rem 5vw 0;
    background:#111;
  }
  .progress-track {
    background:#2A2A2A; height:8px; border-radius:4px; overflow:hidden; position:relative;
  }
  .progress-fill {
    height:100%; background:var(--orange); border-radius:4px; transition:width 1s;
  }
  .progress-labels {
    display:flex; justify-content:space-between;
    font-family:var(--mono); font-size:0.5rem; letter-spacing:0.1em;
    color:rgba(255,248,244,0.3); padding:0.3rem 0 1rem;
  }

  /* MAP */
  .map-list-wrap {
    display: flex;
    align-items: stretch;
  }
  #map {
    width: 50%;
    height: 50vh;
    background: #0A0A0A;
    flex-shrink: 0;
  }
  .tappe-panel {
    width: 50%;
    height: 50vh;
    overflow-y: auto;
    background: #0F0F0F;
    padding: 1.2rem 2vw;
    border-left: 1px solid rgba(240,90,40,0.15);
  }


  /* TAPPE */
  .tappe-section { padding:2rem 5vw; }
  .section-label {
    font-family:var(--mono); font-size:0.6rem; letter-spacing:0.25em;
    text-transform:uppercase; color:var(--orange); margin-bottom:1.2rem;
  }

  .tappa-row {
    display:flex;
    align-items:baseline;
    gap:0.8rem;
    padding:0.8rem 0;
    border-bottom:1px solid rgba(255,248,244,0.06);
    flex-wrap:wrap;
  }
  .tappa-row:hover { background:rgba(240,90,40,0.04); margin:0 -1rem; padding-left:1rem; padding-right:1rem; }
  .tappa-num {
    font-family:'Bebas Neue',sans-serif;
    font-size:1.1rem;
    color:var(--orange);
    min-width:1.8rem;
    flex-shrink:0;
  }
  .tappa-date {
    font-family:var(--mono);
    font-size:0.6rem;
    color:rgba(255,248,244,0.35);
    min-width:4rem;
    flex-shrink:0;
  }
  .tappa-info {
    flex:1;
    font-family:'Barlow Condensed',sans-serif;
    font-size:1rem;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--cream);
  }
  .tappa-info .route { color:rgba(255,248,244,0.7); font-weight:400; font-size:0.9rem; }
  .tappa-info .sep { color:rgba(255,248,244,0.25); margin:0 0.2rem; }
  .tappa-km { font-family:var(--mono); font-size:0.75rem; color:var(--cream); white-space:nowrap; }
  .tappa-dis { font-family:var(--mono); font-size:0.7rem; color:rgba(255,248,244,0.4); white-space:nowrap; }
  .tappa-tot { font-family:var(--mono); font-size:0.6rem; color:rgba(255,248,244,0.2); white-space:nowrap; margin-left:auto; }

  .empty { text-align:center; padding:3rem; font-family:var(--mono); font-size:0.65rem; letter-spacing:0.1em; color:rgba(255,248,244,0.2); text-transform:uppercase; }

  @media(max-width:768px) {
    .stats-bar { gap:1rem; }
    .stat-value { font-size:1.5rem; }
    .map-list-wrap { flex-direction:column; }
    #map { width:100%; height:40vh; }
    .tappe-panel { width:100%; height:auto; border-left:none; border-top:1px solid rgba(240,90,40,0.15); }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">@danny<span>bag</span> · Il Viaggio</div>
    <div class="header-sub">Milano → Palermo · 1.700 km</div>
  </div>
  <div id="last-update" class="header-sub"></div>
</div>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-value" id="stat-tappe">0</div>
    <div class="stat-label">Tappe</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-km">0</div>
    <div class="stat-label">Km percorsi</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-dis">0</div>
    <div class="stat-label">Dislivello ↑ m</div>
  </div>
  <div class="stat" style="margin-left:auto; text-align:right;">
    <div class="stat-value" id="stat-pct" style="color:rgba(255,248,244,0.5);">0%</div>
    <div class="stat-label">Del percorso</div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill" style="width:0%"></div>
  </div>
  <div class="progress-labels">
    <span>Milano</span>
    <span id="prog-label"></span>
    <span>Palermo</span>
  </div>
</div>

<div class="map-list-wrap">
  <div id="map"></div>
  <div class="tappe-panel">
    <div class="section-label" style="margin-bottom:0.8rem;">Tappe percorse</div>
    <div id="tappe-list"><div class="empty">Nessuna tappa ancora</div></div>
  </div>
</div>

<div id="debug-bar" style="background:#111; border-top:1px solid rgba(240,90,40,0.2); padding:0.5rem 5vw; font-family:IBM Plex Mono,monospace; font-size:0.55rem; color:rgba(255,248,244,0.3); display:flex; gap:1.5rem; flex-wrap:wrap;">
  <span id="dbg-tappe">tappe: —</span>
  <span id="dbg-polyline">polyline: —</span>
  <span id="dbg-first">prima tappa: —</span>
</div>

<script>
const GH_API = 'https://api.github.com/repos/dannybag/inbiciperilmondo/contents/data.json';
const TOTAL  = 1700;
let map, routeLayer;

// ---- MAP ----
function initMap() {
  map = L.map('map').setView([44.5, 11.3], 6);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution:'© Esri © OpenStreetMap', maxZoom:18
  }).addTo(map);
  routeLayer = L.layerGroup().addTo(map);
}

function decodePolyline(enc) {
  const pts=[]; let i=0,lat=0,lng=0;
  while(i<enc.length){
    let b,s=0,r=0; do{b=enc.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);
    lat+=(r&1)?~(r>>1):(r>>1); s=0;r=0;
    do{b=enc.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);
    lng+=(r&1)?~(r>>1):(r>>1); pts.push([lat/1e5,lng/1e5]);
  }
  return pts;
}

// Geocode città via Nominatim
const geoCache = {};
async function geocode(city) {
  if(!city) return null;
  const key = city.toLowerCase().trim();
  if(geoCache[key]) return geoCache[key];
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city+', Italy')}&format=json&limit=1`, {
      headers: { 'Accept-Language': 'it' }
    });
    const d = await res.json();
    if(d&&d[0]) { const p=[parseFloat(d[0].lat),parseFloat(d[0].lon)]; geoCache[key]=p; return p; }
  } catch(e){}
  return null;
}

function numIcon(n, last=false) {
  return L.divIcon({
    html: last
      ? `<div style="background:#F05A28;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:0.5rem;font-weight:700;width:2rem;height:2rem;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #fff;box-shadow:0 0 12px rgba(240,90,40,0.8);letter-spacing:0;">QUI</div>`
      : `<div style="background:#F05A28;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:0.6rem;width:1.3rem;height:1.3rem;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid rgba(255,255,255,0.6);">${n}</div>`,
    className:'', iconSize: last?[28,28]:[21,21], iconAnchor: last?[14,14]:[10,10]
  });
}

async function renderMap(tappe) {
  routeLayer.clearLayers();
  if(!tappe.length) return;

  const all=[];
  let lastPt = null;

  for(let i=0; i<tappe.length; i++) {
    const t = tappe[i];
    const isLast = i === tappe.length-1;
    const tip = `<b>${i+1}.</b> ${t.name||t.from||''}<br>${t.from||''} → ${t.to||''}<br>${t.km} km · ↑${t.dislivello||0}m`;

    if(t.polyline) {
      const pts = decodePolyline(t.polyline);
      if(pts.length) {
        L.polyline(pts, {color:'#F05A28', weight:4, opacity: isLast?1:0.75})
         .bindTooltip(tip+'<br><span style="opacity:0.5;font-size:0.7em">📡 traccia GPS</span>', {sticky:true}).addTo(routeLayer);
        L.marker(pts[0], {icon:numIcon(i+1)}).addTo(routeLayer);
        all.push(...pts);
        lastPt = pts[pts.length-1];
      }
    } else {
      // Fallback: geocode from→to
      const fromPt = i===0 ? await geocode(t.from) : lastPt;
      const toPt   = await geocode(t.to || t.from);
      if(fromPt && toPt) {
        L.polyline([fromPt, toPt], {color:'rgba(240,90,40,0.4)', weight:2, opacity:0.6, dashArray:'8,8'})
         .bindTooltip(tip+'<br><span style="opacity:0.5;font-size:0.7em">～ percorso approssimativo</span>', {sticky:true}).addTo(routeLayer);
        L.marker(fromPt, {icon:numIcon(i+1)}).addTo(routeLayer);
        all.push(fromPt, toPt);
        lastPt = toPt;
      }
    }
  }

  // Marker "Sono qui" sull'ultimo punto
  if(lastPt) {
    L.marker(lastPt, {icon:numIcon('', true), zIndexOffset:1000})
     .bindTooltip('📍 Sono qui', {permanent:false}).addTo(routeLayer);
  }

  if(all.length) {
    map.fitBounds(L.latLngBounds(all), {padding:[40,40]});
  } else {
    // Nessun dato - mostra solo Milano come punto di partenza
    const milano = [45.4642, 9.1900];
    map.setView(milano, 7);
    L.marker(milano, {icon:numIcon(0,false)})
     .bindTooltip('Milano · Punto di partenza', {sticky:true}).addTo(routeLayer);
  }
}

// ---- RENDER ----
function render(tappe) {
  const n   = tappe.length;
  const km  = tappe.reduce((s,t)=>s+(t.km||0),0);
  const dis = tappe.reduce((s,t)=>s+(t.dislivello||0),0);
  const pct = Math.min(100,Math.round(km/TOTAL*100));

  document.getElementById('stat-tappe').textContent = n;
  document.getElementById('stat-km').textContent    = km.toLocaleString('it-IT');
  document.getElementById('stat-dis').textContent   = dis.toLocaleString('it-IT');
  document.getElementById('stat-pct').textContent   = pct+'%';
  document.getElementById('prog-fill').style.width  = pct+'%';
  document.getElementById('prog-label').textContent = pct > 0 ? km+' / '+TOTAL+' km' : '';

  // Tappe list
  const list = document.getElementById('tappe-list');
  if(!n){ list.innerHTML='<div class="empty">Nessuna tappa ancora</div>'; renderMap([]); return; }

  const MESI=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  let totKm=0, totDis=0;
  list.innerHTML = tappe.map((t,i)=>{
    totKm  += t.km||0;
    totDis += t.dislivello||0;
    let dateStr = t.day ? 'Tappa '+t.day : '—';
    if(t.date){ const d=new Date(t.date); dateStr=String(d.getDate()).padStart(2,'0')+' '+MESI[d.getMonth()]; }
    const label = (t.from&&t.to) ? `${t.from} → ${t.to}` : (t.from || '—');
    return `<div class="tappa-row">
      <span class="tappa-num">${i+1}</span>
      <span class="tappa-date">${dateStr}</span>
      <span class="tappa-info" style="font-size:1rem;">${label} <span style="font-family:var(--mono);font-size:0.7rem;color:rgba(255,248,244,0.5);margin-left:0.3rem;">${t.km||0} km · ↑${t.dislivello||0} m</span></span>
    </div>`;
  }).join('');

  // Debug
  document.getElementById('dbg-tappe').textContent    = 'tappe: ' + tappe.length;
  document.getElementById('dbg-polyline').textContent = 'con polyline: ' + tappe.filter(t=>t.polyline&&t.polyline.length>0).length;
  document.getElementById('dbg-first').textContent    = tappe[0] ? 'prima: ' + (tappe[0].from||'?') + '→' + (tappe[0].to||'?') + ' poly:' + (tappe[0].polyline?.length||0) : 'nessuna';
  renderMap(tappe);  // async
}

// ---- LOAD ----
async function load() {
  try {
    const res = await fetch(GH_API+'?t='+Date.now(),{cache:'no-store'});
    if(!res.ok){ render([]); return; }
    const d   = await res.json();
    const raw = JSON.parse(new TextDecoder().decode(
      Uint8Array.from(atob(d.content.replace(/\n/g,'')),c=>c.charCodeAt(0))
    ));
    const tappe = (raw.tappe||[]).filter(t=>t.km>0);
    if(tappe.length){
      const last = tappe[tappe.length-1];
      document.getElementById('last-update').textContent =
        'Ultimo aggiornamento: '+(last.date ? new Date(last.date).toLocaleDateString('it-IT') : 'Tappa '+last.day);
    }
    render(tappe);
  } catch(e){ console.error(e); render([]); }
}

initMap();
setTimeout(() => map.invalidateSize(), 100);
load();
</script>
</body>
</html>
